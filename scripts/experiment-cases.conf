# experiment-cases.conf
# 형식: <case-name> <VAR=VALUE>...
#   case-name 은 <type>-<phase> 이며 evidence/<type>/<phase>-* 로 저장된다.
#
# 각 실험은 대상 변수만 바꾸고, 나머지는 다른 장애가 먼저 끼어들지 않도록 고정한다.
# 근거: README 요구사항(MEMORY_LIMIT 50~512, CPU_MAX_OCCUPY 10~100, MULTI_THREAD_ENABLE true/false)
#
# 세 값이 모두 권장 범위(앱 부팅 시 [ OK ])면 앱이 "Healthy System Monitoring" 시나리오로
# 종료 없이 계속 돈다. 그래서 장애가 안 나는 쪽 케이스에는 RUN_TIMEOUT(초)을 걸어 강제 종료한다.

# OOM: MEMORY_LIMIT 100 → 256 (둘 다 MemoryGuard 자가 종료, 생존 시간 비교)
oom-before       MEMORY_LIMIT=100 CPU_MAX_OCCUPY=50 MULTI_THREAD_ENABLE=true
oom-after        MEMORY_LIMIT=256 CPU_MAX_OCCUPY=50 MULTI_THREAD_ENABLE=true

# CPU: CPU_MAX_OCCUPY 90 → 50 (90: [WARNING: Recommend Under 50%], 50% 초과 시 Threshold Violated / 50: 50%에서 cooldown 반복)
cpu-before       RUN_TIMEOUT=120 MEMORY_LIMIT=512 CPU_MAX_OCCUPY=90 MULTI_THREAD_ENABLE=false
cpu-after        RUN_TIMEOUT=120 MEMORY_LIMIT=512 CPU_MAX_OCCUPY=50 MULTI_THREAD_ENABLE=false

# Deadlock: MULTI_THREAD_ENABLE true → false (메모리 512·CPU 50으로 OOM/Watchdog 종료 배제)
# 교착 시 앱이 스스로 끝나지 않으므로 RUN_TIMEOUT 초 후 강제 종료하고 증적을 수집한다.
deadlock-before  RUN_TIMEOUT=120 MEMORY_LIMIT=512 CPU_MAX_OCCUPY=50 MULTI_THREAD_ENABLE=true
deadlock-after   RUN_TIMEOUT=120 MEMORY_LIMIT=512 CPU_MAX_OCCUPY=50 MULTI_THREAD_ENABLE=false
